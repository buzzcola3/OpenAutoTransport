name: Release assets

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and upload release assets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache Bazel output
        uses: actions/cache@v3
        with:
          path: ~/.cache/bazel
          key: ${{ runner.os }}-bazel-${{ hashFiles('**/WORKSPACE') }}
          restore-keys: |
            ${{ runner.os }}-bazel-

      - name: Set up Bazelisk
        uses: bazelbuild/setup-bazelisk@v3

      - name: Bazel info
        run: |
          bazel --version
          bazel info release || true

      - name: Build targets (all variants)
        shell: bash
        run: |
          set -euo pipefail
          # Build headers once (not arch/libc specific)
          bazel build //:wire_capnp_gen

          # Build library for all requested variants
          CONFIGS=(amd64_gnu amd64_musl arm64_gnu arm64_musl)
          for cfg in "${CONFIGS[@]}"; do
            echo "Building //:open_auto_transport with --config=$cfg"
            bazel build --config="$cfg" //:open_auto_transport
          done

      - name: Collect release files
        id: collect
        shell: bash
        run: |
          set -euo pipefail
          BAZEL_BIN=$(bazel info bazel-bin)
          mkdir -p dist

          # Copy generated Cap'n Proto files (declared outs)
          cp -v "$BAZEL_BIN/wire.capnp.h" dist/
          cp -v "$BAZEL_BIN/wire.capnp.c++" dist/

          # Copy public header from workspace
          cp -v wire.hpp dist/

          # Collect libraries from all variants and suffix filenames
          CONFIGS=(amd64_gnu amd64_musl arm64_gnu arm64_musl)
          for cfg in "${CONFIGS[@]}"; do
            echo "Collecting libraries for config=$cfg"
            # Query the files for the target under this config
            mapfile -t LIB_PATHS < <(bazel cquery --config="$cfg" //:open_auto_transport --output=starlark --starlark:expr='"\n".join([f.path for f in target.files.to_list()])')
            if [[ ${#LIB_PATHS[@]} -eq 0 ]]; then
              echo "::error::No artifacts for //:open_auto_transport under --config=$cfg"
              exit 1
            fi
            for p in "${LIB_PATHS[@]}"; do
              if [[ -f "$p" ]]; then
                base=$(basename "$p")
                ext="${base##*.}"
                name="${base%.*}"
                # Preserve both .a and .so with a suffix
                cp -v "$p" "dist/${name}-${cfg}.${ext}"
              fi
            done
          done

          echo "dist contents:" && (ls -l dist || true)

      - name: Upload workflow artifact (for debugging)
        uses: actions/upload-artifact@v4
        with:
          name: open-auto-transport-${{ github.ref_name }}
          path: dist/*

      - name: Publish GitHub Release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
