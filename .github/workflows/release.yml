name: Release assets

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and upload release assets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache Bazel output
        uses: actions/cache@v4
        with:
          path: ~/.cache/bazel
          key: ${{ runner.os }}-bazel-${{ hashFiles('.bazelversion', 'MODULE.bazel', '.bazelrc', 'WORKSPACE') }}
          restore-keys: |
            ${{ runner.os }}-bazel-

      - name: Set up Bazelisk
        uses: bazelbuild/setup-bazelisk@v3

      - name: Bazel info
        run: |
          bazel --version
          bazel info release || true

      - name: Build and collect (per variant)
        id: build_collect
        shell: bash
        run: |
          set -euo pipefail
          # Build headers once (not arch/libc specific)
          bazel build //:wire_capnp_gen

          BAZEL_BIN=$(bazel info bazel-bin)
          EXEC_ROOT=$(bazel info execution_root)
          mkdir -p dist
          # Copy essential headers
          cp -v "$BAZEL_BIN/wire.capnp.h" dist/
          cp -v "$BAZEL_BIN/wire.capnp.c++" dist/
          cp -v wire.hpp dist/
          cp -v transport.hpp dist/
          mkdir -p dist/shared_memory
          cp -v shared_memory/duplex_shm_transport.hpp dist/shared_memory/

          CONFIGS=(amd64_gnu amd64_musl arm64_gnu arm64_musl)
          for cfg in "${CONFIGS[@]}"; do
            echo "== Config: $cfg =="
            echo "Building //:open_auto_transport"
            bazel build --config="$cfg" //:open_auto_transport

            echo "Collecting library artifacts"
            mapfile -t LIB_PATHS < <(bazel cquery --config="$cfg" //:open_auto_transport --output=starlark --starlark:expr='"\n".join([f.path for f in target.files.to_list()])')
            if [[ ${#LIB_PATHS[@]} -eq 0 ]]; then
              echo "::error::No artifacts for //:open_auto_transport under --config=$cfg"
              exit 1
            fi
            for p in "${LIB_PATHS[@]}"; do
              if [[ -f "$p" ]]; then
                base=$(basename "$p")
                if [[ "$base" == *.* ]]; then
                  ext=".${base##*.}"
                  name="${base%.*}"
                else
                  ext=""
                  name="$base"
                fi
                cp -v "$p" "dist/${name}-${cfg}${ext}"
              fi
            done

            echo "Building //:open_auto_transport_demo"
            bazel build --config="$cfg" //:open_auto_transport_demo
            echo "Collecting demo binary"
            mapfile -t DEMO_PATHS < <(bazel cquery --config="$cfg" //:open_auto_transport_demo --output=starlark --starlark:expr='"\n".join([f.path for f in target.files.to_list()])')
            if [[ ${#DEMO_PATHS[@]} -eq 0 ]]; then
              echo "::error::No artifacts for //:open_auto_transport_demo under --config=$cfg"
              exit 1
            fi
            target_name="open_auto_transport_demo"
            picked=""
            for p in "${DEMO_PATHS[@]}"; do
              if [[ -f "$p" && "$(basename "$p")" == "$target_name" ]]; then picked="$p"; break; fi
            done
            if [[ -z "$picked" ]]; then
              for p in "${DEMO_PATHS[@]}"; do
                if [[ -f "$p" && -x "$p" ]]; then picked="$p"; break; fi
              done
            fi
            if [[ -z "$picked" ]]; then
              for p in "${DEMO_PATHS[@]}"; do
                if [[ -f "$p" ]]; then cp -v "$p" "dist/${target_name}-${cfg}-misc-$(basename "$p")"; fi
              done
            else
              cp -v "$picked" "dist/${target_name}-${cfg}"
            fi

            echo "Collecting capnp/kj for $cfg"
            bazel build --config="$cfg" @capnp-cpp//src/capnp:capnp @capnp-cpp//src/kj:kj
            CAPNP_LIB="$BAZEL_BIN/external/capnp-cpp+/src/capnp/libcapnp.a"
            KJ_LIB="$BAZEL_BIN/external/capnp-cpp+/src/kj/libkj.a"
            if [[ -f "$CAPNP_LIB" ]]; then cp -v "$CAPNP_LIB" "dist/libcapnp-${cfg}.a"; fi
            if [[ -f "$KJ_LIB" ]]; then cp -v "$KJ_LIB" "dist/libkj-${cfg}.a"; fi

            echo "Collecting libc++ runtime for $cfg"
            TOOLCHAIN_LIB_DIR="$EXEC_ROOT/external/hermetic_cc_toolchain++toolchains+zig_config/lib"
            for lib in libc++.so libc++abi.so libunwind.so libc++.a libc++abi.a libunwind.a; do
              if [[ -f "$TOOLCHAIN_LIB_DIR/$lib" ]]; then
                base="${lib%.*}"
                ext="${lib##*.}"
                cp -v "$TOOLCHAIN_LIB_DIR/$lib" "dist/${base}-${cfg}.${ext}"
              fi
            done
          done

          echo "dist contents:" && (ls -l dist || true)

      - name: Upload workflow artifact (for debugging)
        uses: actions/upload-artifact@v4
        with:
          name: open-auto-transport-${{ github.ref_name }}
          path: dist/*

      - name: Publish GitHub Release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
          fail_on_unmatched_files: true
          body: |
            OpenAutoTransport release for Linux only.

            Supported Linux variants (prebuilt):
            - x86_64 (amd64) with glibc: amd64_gnu
            - x86_64 (amd64) with musl: amd64_musl
            - aarch64 (arm64) with glibc: arm64_gnu
            - aarch64 (arm64) with musl: arm64_musl

            Artifacts include:
            - libopen_auto_transport-{variant}.a and .so (self-contained)
            - open_auto_transport_demo-{variant}
            - Cap'n Proto libs: libcapnp-{variant}.a, libkj-{variant}.a
            - libc++ runtimes: libc++-{variant}.so/.a, libc++abi-{variant}.so/.a, libunwind-{variant}.so/.a
            - Headers: wire.capnp.h, wire.capnp.c++, wire.hpp, transport.hpp, shared_memory/duplex_shm_transport.hpp
            
            Usage options:
            - Option A: Link libopen_auto_transport-{variant}.a (includes all symbols)
            - Option B: Compile wire.capnp.c++ yourself (don't use the .a for wire symbols)
            - If you link the bundled libc++ runtimes, add: -Wl,-rpath,'$ORIGIN' -lc++ -lc++abi -lunwind -lcapnp -lkj -pthread
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
